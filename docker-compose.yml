services:
  bridge:
    build: .
    # 默认用 Docker Hub 上的镜像；自己构建时：
    #   IMAGE=zspace-emby-bridge:local docker compose up -d --build
    image: ${IMAGE:-snarl6818/zspace-emby-bridge:latest}
    container_name: zspace-emby-bridge
    restart: unless-stopped
    ports:
      # 绑定地址、对外端口、容器内端口都能用 .env 覆盖：
      #   BIND_IP=0.0.0.0  BRIDGE_PORT=8022  LISTEN_PORT=8022
      # 极空间系统进程占用 127.0.0.1:8022 时，写 BIND_IP=192.168.2.8 即可
      - "${BIND_IP:-0.0.0.0}:${BRIDGE_PORT:-8022}:${LISTEN_PORT:-8022}"
    env_file:
      - .env
    environment:
      NATIVE_MODE: local
      NATIVE_DB_PATH: /zvideo/zvideo.db
      # 配置与进度库都放在 compose 同目录的 config/ 里
      DB_PATH: /data/progress.db
      LISTEN_PORT: ${LISTEN_PORT:-8022}
    volumes:
      - ./config:/data
      - ${NATIVE_DB_DIR:-/zspace/zsrp/sqlite/zvideo}:/zvideo
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request,sys; port=os.environ.get('LISTEN_PORT','8022'); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{port}/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
